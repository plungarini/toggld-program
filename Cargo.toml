[package]
name = "toggld-workspace"
description = "TOGGLD Rust workspace root — LiteSVM integration tests live here; game logic lives in programs/toggld"
edition = "2021"
publish = false

[workspace]
members = ["programs/toggld"]
exclude = ["fuzz"]
resolver = "2"

[dev-dependencies]
# `test-fixtures`: host-side constants must match the fixture SBF build the
# tests load (target/deploy-test-fixtures/toggld.so, see tests/toggld.rs).
toggld = { path = "programs/toggld", features = ["test-fixtures"] }
anchor-lang = "1.1.2"
# Phase R3 (Win NFT): needed here too so LiteSVM tests can build `mint_win_nft`
# instructions/accounts (`mpl_core::ID` for the `mpl_core_program` account) and
# assert against the real Core CPI outcome.
mpl-core = "0.12.1"
# "precompiles": without it LiteSVM never loads the native Ed25519Program
# account at all, so any `mint_win_nft` test relying on a real Ed25519
# signature verification (Mechanism 2) would silently exercise a program
# that doesn't exist in the VM rather than the real attestation path.
litesvm = { version = "0.10.0", features = ["precompiles"] }
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"
solana-clock = "3.0"
solana-account = "3.2.0"
solana-address = "2.0"
bincode = "1.3"
# Phase R3 redesign (Win NFT tamper-proofing, Mechanism 2): build/sign the
# native Ed25519Program instruction tests place immediately before
# `mint_win_nft`, and read the instructions-sysvar `ID` the accounts struct
# now address-constrains against. Pinned to the exact versions already
# resolved transitively via anchor-lang, see programs/toggld/Cargo.toml.
solana-instructions-sysvar = "3.0.1"
solana-sdk-ids = "3.1.0"
ed25519-dalek = "2.2.0"
# Decodes Anchor `emit!` event logs (ChallengeEvent) in tests; already in the lockfile via Solana crates.
base64 = "0.22.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
opt-level = "z"
strip = true
panic = "abort"

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
